version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: decklinq-db
    environment:
      POSTGRES_DB: decklinq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d decklinq"]
      interval: 5s
      timeout: 5s
      retries: 10
  # Add the pgweb layer below
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: pgweb
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/decklinq?sslmode=disable
    depends_on:
      - postgres

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_CONNECTION_URL: "Host=postgres;Database=decklinq;Username=postgres;Password=postgres"
      DB_USER: postgres
      DB_PASSWORD: postgres
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres_data:
